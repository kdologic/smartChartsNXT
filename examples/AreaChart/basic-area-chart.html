<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic and simple - Area Chart | SmartChartsNXT</title>
  <link rel="stylesheet" href="../static/css/example.common.style.css" type="text/css">
  <script src="../../dist/smartchartsnxt.js" type="text/javascript"></script>
  <script src="../static/js/example.common.js" type="text/javascript"></script>
</head>

<body>
  <div role="figure" class="chart-base">
    <div id="chartContainer"></div>
  </div>
  <script type="text/javascript">
    SmartChartsNXT.ready(function () {
      let areaChart = new SmartChartsNXT.Chart({
        "type": $SC.CHART_TYPE.AREA_CHART,
        "targetElem": "chartContainer",
        "a11y": {
          "description": "Basic area chart with SmartChartsNxt."
        },
        "title": {
          "text": "<b>Basic Area Chart</b>",
        },
        "gridBox": {
          "horizontal": {
            "lineStyle": $SC.ENUMS.LINE_STYLE.DASHED
          },
        },
        "legends": {
          "enable": false,
        },
        "dataSet": {
          "xAxis": {
            "title": "Days",
            "categories": {
              "value": ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
            }
          },
          "yAxis": {
            "title": "Values",
            "zeroBase": true,
          },
          "series": [{
            "name": "Series 1",
            "data": [710, 944, 865, 980, 1220, 1440, 1380],
            "areaColor": $SC.COLOR_STRINGS.MAT_BLUE
          }]
        }
      });
    });
  </script>
</body>

</html>
