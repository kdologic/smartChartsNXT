<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Area chart | SmartChartsNXT</title>
  <link rel="stylesheet" href="../static/css/example.common.style.css" type="text/css">
  <script src="../../dist/smartchartsnxt.js" type="text/javascript"></script>
  <script src="../static/js/example.common.js" type="text/javascript"></script>
  <script type="text/javascript" language="javascript" src="../static/data/stock-data.js"></script> 
</head>

<body style="background: rgb(34, 120, 180);">
  <div role="figure" class="chart-base">
    <div id="chartContainer"></div>
  </div>
  <script>
    var areaChart;
    var dataSet = prepareData(stockData);
    displayChart("ABC-Stock", dataSet);

    function prepareData(data) {
      var dataSet = [];
      for (key in data["Time Series (Daily)"]) {
        dataSet.push({
          label: key,
          value: parseFloat(data["Time Series (Daily)"][key]["4. close"])
        });
      }
      dataSet = dataSet.filter(function (d) { return d.value > 0 });
      return dataSet.reverse();
    }

    function displayChart(seriesName, dataSet) {
      console.log(dataSet);
      SmartChartsNXT.ready(function () {
        SmartChartsNXT.debug = false;
        areaChart = new SmartChartsNXT.Chart({
          "type": $SC.CHART_TYPE.AREA_CHART,
          "targetElem": "chartContainer",
          "bgColor": "#f7fdf7",
          "title": {
            "text": "Stock Area Chart - Dynamic data loading"
          },
          "subtitle": {
            "text": "Time Series"
          },
          "dataSet": {
            "xAxis": {
              "title": "Date",
              "categories": {
                "parseAsDate": true,
                "displayDateFormat": "DD-MM-YYYY", 
              },
              "labelRotate": -45,
            },
            "yAxis": {
              "title": "Unit value",
              "prepend": "\u20B9 ",
              "zeroBase": false,
            },
            "series": [{
              "areaColor": "#2278b4",
              "name": seriesName,
              "areaOpacity": 0.3,
              "spline": false,
              "marker": {
                "enable": false
              },
              "data": [...dataSet.slice(1,30)]
            }]
          }
        });

        /* Added data asynchronously and render */
        let intervalId = setInterval(addData, 500);
        let currentIndex = 30;
        function addData() {
          areaChart.config._state.dataSet.series[0].data.shift();
          areaChart.config._state.dataSet.series[0].data.push(dataSet[currentIndex++]);
          areaChart.render(); /* Re-draw the chart */
          if (currentIndex >= dataSet.length) {
            clearInterval(intervalId);
          }
        }
      });
    }
  </script>
</body>

</html>
