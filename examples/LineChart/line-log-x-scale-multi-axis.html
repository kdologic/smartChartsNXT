<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X axis Log Scale with Line Chart | SmartChartsNXT</title>
  <link rel="stylesheet" href="../static/css/example.common.style.css" type="text/css">
  <script src="../../dist/smartchartsnxt.js" type="text/javascript"></script>
  <script src="../static/js/example.common.js" type="text/javascript"></script>
</head>

<body style="background: #395a91;">
  <div role="figure" class="chart-base">
    <div id="chartContainer"></div>
    <p class="chart-caption" aria-hidden="true">
      This chart demonstrate the logarithmic x axis with multiple axis view to track two differently propagated series.
    </p>
  </div>

  <script type="text/javascript">
    var lineChart;
    var step = Math.pow(10, .05);
    SmartChartsNXT.ready()
      .then(function () {
        lineChart = new SmartChartsNXT.Chart({
          "type": $SC.CHART_TYPE.LINE_CHART,
          "targetElem": "chartContainer",
          "bgColor": "#9DE5FF",
          "a11y": {
            "description": "This chart demonstrate the logarithmic X axis with multiple axis view to track the series from both end."
          },
          "title": {
            "text": "<span style='font:24px;'><b>Low Pass Filters Frequency Response Behavior <b></span>",
            "textColor": "#841B2D"
          },
          "subtitle": {
            "text": "X axis logarithmic scale",
            "textColor": "#014B43"
          },
          "gridBox": {
            "vertical": {
              "enable": false
            },
            "bgColor": "#FFF",
            "bgOpacity": 1
          },
          "legends": {
            "itemBorderWidth": 0
          },
          "dataSet": {
            "xAxis": {
              "type": $SC.ENUMS.AXIS_TYPE.LOGARITHMIC,
              "title": "Frequency \u03C9(rad/s)",
              "intervalThreshold": 100,
              "append": " \u03C9\u2099",
              "modifier": function(labelValue) {
                return parseFloat(labelValue).toFixed(2);
              },
              "markRegions": [{       
                "from": 41,
                "to": 41.1,
                "color": "#FDEE00",
                "borderColor": "#FDEE00",
                "opacity": 1,
                "label": {
                  "text": "Cutoff Frequency",
                  "verticalTextAlign": $SC.ENUMS.VERTICAL_ALIGN.BOTTOM, 
                  "horizontalTextAlign": $SC.ENUMS.HORIZONTAL_ALIGN.LEFT, 
                  "fontSize": 14,
                  "color": "#000",
                  "style": {}                
                }
              }]
            },
            "yAxis": [{
              "title": "Magnitude (db)",
              "titleColor": "#014B43",
              "axisColor": "#014B43", 
              "tickColor":"#014B43",
              "labelColor": "#014B43"
            },{
              "title": "Magnitude (db)",
              "labelAlign": $SC.ENUMS.HORIZONTAL_ALIGN.LEFT,
              "positionOpposite": true,
              "titleColor": "#FF033E",
              "axisColor": "#FF033E", 
              "tickColor":"#FF033E",
              "labelColor": "#FF033E"
            }],
            "series": [{
              "name": "Type 1 Filter",
              "lineWidth": 2,
              "lineColor": "#154121",
              "spline": false,
              "marker": {
                "enable": false
              },
              "yAxisLinkIndex": 0,
              "data": type1DataPoints(step)
            },{
              "name": "Type 2 Filter",
              "lineWidth": 2,
              "lineColor": "#FF033E",
              "spline": false,
              "marker": {
                "enable": false
              },
              "yAxisLinkIndex": 0,
              "data": type2DataPoints(.02, step)
            }]
          }
        });
      });

      function type1DataPoints(step) {
        var dataPoints = [];
        var value;
        for(var label = .01; label < 100 ; label *= step){
          value =  -5 * Math.log(label*label + 1);
          dataPoints.push({'label': label, 'value': value});
        }
        console.log(dataPoints);
        return dataPoints;
      }

      function type2DataPoints(e, step) {
        var dataPoints = [];
        var h;
        for(var w = .01; w < 100 ; w *= step){
          h =  -5 * Math.log(Math.pow((1 - w*w), 2) + 4 *e*e*w*w);
          dataPoints.push({'label': w, 'value': h-10});
        }
        console.log(dataPoints);
        return dataPoints;
      }
  </script>
</body>

</html>
